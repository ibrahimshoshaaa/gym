name: Verify application
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: gym-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: test-password
          POSTGRES_DB: gym_test
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready --health-interval 5s
          --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
        working-directory: backend
      - run: npm test
        working-directory: backend
        env:
          TEST_DATABASE_URL: postgresql://postgres:test-password@localhost:5432/gym_test
  flutter:
    runs-on: ubuntu-latest
    env:
      API_BASE_URL: ${{ vars.GYM_API_BASE_URL || 'https://golden-gym-api.vercel.app' }}
      ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      ANDROID_STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
      ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
      ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.47.7'
          cache: true
      - name: Resolve dependencies
        run: |
          flutter pub get
          python -c 'import json,pathlib; paths=["pubspec.lock","windows/flutter/generated_plugin_registrant.cc","windows/flutter/generated_plugins.cmake","macos/Flutter/GeneratedPluginRegistrant.swift","linux/flutter/generated_plugin_registrant.cc","linux/flutter/generated_plugins.cmake"]; print("RESOLVED_FILES="+json.dumps({p:pathlib.Path(p).read_text() for p in paths if pathlib.Path(p).exists()}))'
      - run: flutter analyze --no-fatal-infos --no-fatal-warnings
      - run: flutter test
      - name: Restore private release signing key
        if: github.event_name != 'pull_request' && env.ANDROID_KEYSTORE_BASE64 != ''
        run: python -c 'import base64,os,pathlib; pathlib.Path("android/app/release.jks").write_bytes(base64.b64decode(os.environ["ANDROID_KEYSTORE_BASE64"],validate=True))'
      - name: Compile optimized Android APKs
        env:
          ALLOW_UNSIGNED_RELEASE: '1'
        run: flutter build apk --release --split-per-abi --split-debug-info=build/symbols --dart-define=API_BASE_URL="$API_BASE_URL"
      - name: Validate release mode and package offline signing tools
        run: |
          python scripts/check_release_apks.py
          mkdir -p build/release-package
          cp build/app/outputs/flutter-apk/*-release.apk build/release-package/
          signer_jar="$(find "$ANDROID_HOME/build-tools" -path '*/lib/apksigner.jar' | sort -V | tail -1)"
          test -n "$signer_jar"
          cp "$signer_jar" build/release-package/apksigner.jar
      - name: Upload optimized APKs for offline signing
        uses: actions/upload-artifact@v4
        with:
          name: gym-release-build
          path: build/release-package/
          retention-days: 7
      - name: Keep crash symbols
        uses: actions/upload-artifact@v4
        with:
          name: gym-release-symbols
          path: build/symbols/
          retention-days: 90
