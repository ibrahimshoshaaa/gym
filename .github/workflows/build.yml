name: Build Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Install dependencies
        run: flutter pub get

      - name: Restore debug keystore
        # بنحوّل ملف debug-keystore-base64.txt (نص عادي، آمن إنه يترفع
        # على الجيت بسهولة) لملف debug.keystore حقيقي قبل الـ build.
        # ده بديل عن رفع ملف .keystore باينري مباشرة، اللي ممكن يضيع
        # بسهولة لو اترفع بطريقة يدوية (زي رفع ملفات على GitHub من
        # المتصفح) - النص بيبقى مضمون إنه يترفع صح زي أي ملف كود عادي.
        run: |
          if [ ! -f android/app/debug-keystore-base64.txt ]; then
            echo "::error::ملف android/app/debug-keystore-base64.txt مش موجود في الريبو - لازم يترفع مع باقي الكود"
            exit 1
          fi
          base64 -d android/app/debug-keystore-base64.txt > android/app/debug.keystore
          ls -la android/app/debug.keystore

      - name: Build release APK
        run: flutter build apk --release

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: gym-manager-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk