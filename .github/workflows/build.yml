name: Build Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      # firebase_options.dart بيتستورد مباشرة في main.dart، فمن غيره
      # الـ build هيفشل من مرحلة الـ compile مش بس وقت التشغيل.
      # عشان كده بنحطه كـ secret (base64) بدل ما يتحط في الجيت مباشرة.
      - name: Restore firebase_options.dart from secret
        run: |
          mkdir -p lib
          echo "${{ secrets.FIREBASE_OPTIONS_DART_B64 }}" | base64 -d > lib/firebase_options.dart

      - name: Restore google-services.json from secret
        run: |
          mkdir -p android/app
          echo "${{ secrets.GOOGLE_SERVICES_JSON_B64 }}" | base64 -d > android/app/google-services.json

      - name: Install dependencies
        run: flutter pub get

      - name: Build release APK
        run: flutter build apk --release

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: gym-manager-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
