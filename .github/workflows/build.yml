name: Build Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      # firebase_options.dart بيتستورد مباشرة في main.dart، فمن غيره
      # الـ build هيفشل من مرحلة الـ compile مش بس وقت التشغيل.
      # عشان كده بنحطه كـ secret (base64) بدل ما يتحط في الجيت مباشرة.
           - name: Install dependencies
        run: flutter pub get

      - name: Build release APK
        run: flutter build apk --release

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: gym-manager-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
