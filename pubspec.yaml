name: gym_manager
description: "Gym Management System - Admin, Staff & Member roles"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # State management
  flutter_riverpod: ^2.5.1
  riverpod_annotation: ^2.3.5

  # Routing
  go_router: ^14.2.0

  # Firebase
  firebase_core: ^3.1.0
  firebase_auth: ^5.1.0
  cloud_firestore: ^5.0.1
  firebase_messaging: ^15.1.0

  # UI
  cupertino_icons: ^1.0.6
  intl: ^0.19.0
  image_picker: ^1.1.2

  # Image upload (Cloudinary - بديل مجاني لـ Firebase Storage)
  http: ^1.2.2

  # QR code (for check-in)
  qr_flutter: ^4.1.0
  mobile_scanner: ^5.1.1

  # Utilities
  equatable: ^2.0.5
  dartz: ^0.10.1
  uuid: ^4.4.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  build_runner: ^2.4.9
  riverpod_generator: ^2.4.0

flutter:
  uses-material-design: true
